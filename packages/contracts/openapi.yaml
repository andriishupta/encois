openapi: 3.1.0
info:
  title: Encois Gateway API
  version: 1.0.0
paths:
  /api/v1/auth/me:
    get:
      operationId: getAuthenticationStatus
      summary: Resolve the authenticated Identity Platform user to Encois access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active access or a valid identity awaiting an Encois invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          description: Missing or invalid Identity Platform token
        '503':
          description: Authentication or access provisioning is unavailable
  /api/v1/public/waitlist:
    post:
      operationId: submitWaitlistRequest
      summary: Request access to the invite-only Encois product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistSubmissionResponse'
        '400':
          description: Invalid request
        '429':
          description: Rate limit exceeded
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      summary: List integrations visible in the caller's effective scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped integration projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListResponse'
  /api/v1/integrations/{integrationId}:
    post:
      operationId: updateIntegration
      summary: Update integration control-plane metadata
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdateRequest'
      responses:
        '200':
          description: Updated integration projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
  /api/v1/organization:
    get:
      operationId: getOrganization
      summary: Get the organization projection visible to the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization, visible units, members, and manageable permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/v1/organization/units:
    get:
      operationId: listOrganizationUnits
      summary: List organization units visible to the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible organization units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitListResponse'
    post:
      operationId: createOrganizationUnit
      summary: Create a child organization unit inside the caller's management scope
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUnitCreateRequest'
      responses:
        '201':
          description: Created organization unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitResponse'
  /api/v1/organization/members:
    get:
      operationId: listOrganizationMembers
      summary: List organization members visible to the caller's management scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible organization members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberListResponse'
  /api/v1/organization/permissions:
    get:
      operationId: listOrganizationPermissions
      summary: List direct membership permissions manageable by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Manageable direct membership permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPermissionListResponse'
    post:
      operationId: createOrganizationPermission
      summary: Create or update a direct membership permission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPermissionCreateRequest'
      responses:
        '201':
          description: Created or updated direct permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPermissionResponse'
  /api/v1/organization/permissions/{permissionId}:
    patch:
      operationId: updateOrganizationPermission
      summary: Change a direct membership permission's access level
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPermissionUpdateRequest'
      responses:
        '200':
          description: Updated direct permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPermissionResponse'
    delete:
      operationId: deleteOrganizationPermission
      summary: Remove a direct membership permission
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permission removed and audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
  /api/v1/sources:
    get:
      operationId: listKnowledgeSources
      summary: List Knowledge Sources visible in the caller's scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped Knowledge Sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceListResponse'
    post:
      operationId: createKnowledgeSource
      summary: Register a scoped Knowledge Source
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSourceCreateRequest'
      responses:
        '201':
          description: Source registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceResponse'
  /api/v1/sources/uploads:
    post:
      operationId: uploadKnowledgeSourcePdf
      summary: Upload a PDF as a new Knowledge Source and immutable revision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file, maximum 10 MiB
                name:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: Source and immutable revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceUploadResponse'
  /api/v1/sources/{sourceId}:
    get:
      operationId: getKnowledgeSource
      summary: Get a Knowledge Source and its immutable revisions
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceDetailResponse'
        '404':
          description: Source not found
  /api/v1/sources/{sourceId}/revisions:
    post:
      operationId: createSourceRevision
      summary: Register an immutable source revision by artifact/provider reference
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRevisionCreateRequest'
      responses:
        '201':
          description: Revision registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRevisionResponse'
  /api/v1/sources/{sourceId}/revisions/{revisionId}/ingest:
    post:
      operationId: startSourceIngestion
      summary: Start the platform-owned source ingestion Workflow
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trigger:
                  $ref: '#/components/schemas/SourceIngestionTrigger'
      responses:
        '202':
          description: Ingestion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceIngestionLaunchResponse'
  /api/v1/workflows:
    post:
      operationId: startWorkflow
      summary: Start a registered workflow or generic Blueprint execution
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '202':
          description: Workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
    get:
      operationId: listWorkflows
      summary: List workflow projections visible in the caller's effective scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped workflow projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionListResponse'
  /api/v1/internal/coordinator/plans/validate:
    post:
      operationId: validateCoordinatorWorkflowChangePlan
      summary: Validate a Coordinator proposal through the private service boundary
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '200':
          description: Plan validated but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanValidationResponse'
  /api/v1/internal/coordinator/plans:
    post:
      operationId: submitCoordinatorWorkflowChangePlan
      summary: Submit a Coordinator proposal through the private service boundary
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '202':
          description: Proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/internal/coordinator/workflows:
    post:
      operationId: startCoordinatorApprovedWorkflow
      summary: Start a generic Workflow from an approved Blueprint registry snapshot
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '202':
          description: Approved workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
  /api/v1/workflows/{workflowId}/updates:
    post:
      operationId: updateWorkflowContext
      summary: Apply scoped context to an active workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdateRequest'
      responses:
        '200':
          description: Update accepted and completed by Temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowUpdateResponse'
  /api/v1/workflows/{workflowId}:
    get:
      operationId: getWorkflow
      summary: Read a tenant-authorized workflow projection
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
  /api/v1/workflows/{workflowId}/signals:
    post:
      operationId: signalWorkflow
      summary: Send an authorized workflow Signal
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowSignalRequest'
      responses:
        '200':
          description: Signal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSignalResponse'
  /api/v1/workflows/plans/validate:
    post:
      operationId: validateWorkflowChangePlan
      summary: Validate a proposed workflow change without applying it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '200':
          description: Plan validated but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanValidationResponse'
  /api/v1/workflows/plans:
    post:
      operationId: submitWorkflowChangePlan
      summary: Persist a validated workflow change proposal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '202':
          description: New proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
        '200':
          description: Idempotent replay of an existing proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/{planId}/approve:
    post:
      operationId: approveWorkflowChangePlan
      summary: Approve a persisted workflow change proposal
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal approved but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/{planId}/apply:
    post:
      operationId: applyWorkflowChangePlan
      summary: Apply an approved workflow change plan to the Blueprint registry or execution
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved workflow change applied; unsupported target operations return a stable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceTokenAuth:
      type: apiKey
      in: header
      name: X-Encois-Service-Token
  parameters:
    OrganizationHeader:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
  schemas:
    AuthStatusResponse:
      oneOf:
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status, userId, organizationId, permissions]
              properties:
                status: { const: active }
                userId: { type: string }
                organizationId: { type: string }
                permissions:
                  type: array
                  items: { $ref: '#/components/schemas/Permission' }
                displayName: { type: string }
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { const: pending }
    OrganizationUnitType:
      type: string
      enum: [organization, department, team, project, service, custom]
    AccessLevel:
      type: string
      enum: [viewer, contributor, manager, admin]
    Permission:
      type: string
      enum: [onboarding:manage, workflows:read, workflows:run, workflows:manage, integrations:read, integrations:manage, knowledge:read, knowledge:manage, organization:read, organization:manage, settings:read, settings:manage]
    OrganizationMembershipStatus:
      type: string
      enum: [invited, active, suspended]
    OrganizationUnitProjection:
      type: object
      additionalProperties: false
      required: [id, organizationId, parentId, type, slug, name, description, manager, memberCount]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/OrganizationUnitType' }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        manager: { type: string }
        memberCount: { type: integer, minimum: 0 }
    OrganizationMemberProjection:
      type: object
      additionalProperties: false
      required: [id, initials, name, role, roleKey, status]
      properties:
        id: { type: string, format: uuid }
        initials: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        roleKey: { type: string }
        homeUnitId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrganizationMembershipStatus' }
    OrganizationPermissionProjection:
      type: object
      additionalProperties: false
      required: [id, memberId, unitId, access, propagateToChildren]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AccessLevel' }
        propagateToChildren: { const: true }
    OrganizationProjection:
      type: object
      additionalProperties: false
      required: [organization, units, members, permissions]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, slug, name]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        units:
          type: array
          items: { $ref: '#/components/schemas/OrganizationUnitProjection' }
        members:
          type: array
          items: { $ref: '#/components/schemas/OrganizationMemberProjection' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/OrganizationPermissionProjection' }
    OrganizationUnitCreateRequest:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        parentId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/OrganizationUnitType' }
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 96 }
    OrganizationPermissionCreateRequest:
      type: object
      additionalProperties: false
      required: [memberId, unitId, access]
      properties:
        memberId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AccessLevel' }
    OrganizationPermissionUpdateRequest:
      type: object
      additionalProperties: false
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/AccessLevel' }
    OrganizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationProjection' }
    OrganizationUnitResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationUnitProjection' }
    OrganizationUnitListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationUnitProjection' }
    OrganizationMemberListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationMemberProjection' }
    OrganizationPermissionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationPermissionProjection' }
    OrganizationPermissionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationPermissionProjection' }
    DeletedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { const: true }
    WaitlistRequest:
      type: object
      additionalProperties: false
      description: Requires a work email, company name, and at least one company website or company LinkedIn URL.
      required: [email, companyName]
      properties:
        email: { type: string, format: email, maxLength: 320, description: Work email; common personal mailbox providers are rejected }
        displayName: { type: string, maxLength: 160 }
        companyName: { type: string, minLength: 1, maxLength: 160 }
        companyWebsite: { type: string, format: uri, maxLength: 500 }
        companyLinkedinUrl: { type: string, format: uri, maxLength: 500 }
        message: { type: string, maxLength: 2000 }
    WaitlistSubmissionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted: { const: true }
    IntegrationStatus:
      type: string
      enum: [pending, active, disabled, error]
    KnowledgeSourceKind:
      type: string
      enum: [integration, uploaded_document, manual, media]
    KnowledgeSourceStatus:
      type: string
      enum: [draft, connecting, discovering, ingesting, active, degraded, needs_reauth, failed, disabled]
    SourceRevisionStatus:
      type: string
      enum: [pending, ingesting, active, failed, superseded]
    SourceIngestionTrigger:
      type: string
      enum: [bootstrap, manual, webhook, schedule, reconcile]
    KnowledgeSourceScope:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    KnowledgeSource:
      type: object
      additionalProperties: false
      required: [contractVersion, id, organizationId, name, kind, status, readScope, visibilityScope, createdAt, updatedAt]
      properties:
        contractVersion: { const: knowledge-source.v1 }
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/KnowledgeSourceKind' }
        provider: { type: string }
        integrationId: { type: string }
        status: { $ref: '#/components/schemas/KnowledgeSourceStatus' }
        readScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        visibilityScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        contentType: { type: string }
        currentRevisionId: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    KnowledgeSourceCreateRequest:
      type: object
      additionalProperties: false
      required: [name, kind, readScope, visibilityScope]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: '#/components/schemas/KnowledgeSourceKind' }
        provider: { type: string }
        integrationId: { type: string }
        readScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        visibilityScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        contentType: { type: string }
        configuration: { type: object, additionalProperties: true }
    SourceRevision:
      type: object
      additionalProperties: false
      required: [contractVersion, id, sourceId, organizationId, revision, status, createdAt]
      properties:
        contractVersion: { const: source-revision.v1 }
        id: { type: string }
        sourceId: { type: string }
        organizationId: { type: string }
        revision: { type: string }
        status: { $ref: '#/components/schemas/SourceRevisionStatus' }
        artifactRef: { type: string }
        sourceObjectId: { type: string }
        contentType: { type: string }
        checksum: { type: string }
        observedAt: { type: string }
        ingestedAt: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string }
    SourceRevisionCreateRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: string, minLength: 1, maxLength: 128 }
        artifactRef: { type: string }
        sourceObjectId: { type: string }
        contentType: { type: string }
        checksum: { type: string }
        observedAt: { type: string }
        metadata: { type: object, additionalProperties: true }
    KnowledgeSourceResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/KnowledgeSource' }
    KnowledgeSourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeSource' }
    KnowledgeSourceDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [source, revisions, ingestionRuns]
          properties:
            source: { $ref: '#/components/schemas/KnowledgeSource' }
            revisions:
              type: array
              items: { $ref: '#/components/schemas/SourceRevision' }
            ingestionRuns:
              type: array
              items: { $ref: '#/components/schemas/SourceIngestionRun' }
    SourceRevisionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SourceRevision' }
    SourceIngestionLaunchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [source, revision, workflow, resultContract]
          properties:
            source: { $ref: '#/components/schemas/KnowledgeSource' }
            revision: { $ref: '#/components/schemas/SourceRevision' }
            workflow: { $ref: '#/components/schemas/WorkflowExecutionProjection' }
            resultContract: { const: source-ingestion-result.v1 }
    KnowledgeSourceUploadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [source, revision]
          properties:
            source: { $ref: '#/components/schemas/KnowledgeSource' }
            revision: { $ref: '#/components/schemas/SourceRevision' }
    SourceIngestionRun:
      type: object
      additionalProperties: false
      required: [id, sourceId, sourceRevisionId, temporalWorkflowId, trigger, status, factsCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        sourceRevisionId: { type: string, format: uuid }
        temporalWorkflowId: { type: string }
        temporalRunId: { type: string }
        trigger: { $ref: '#/components/schemas/SourceIngestionTrigger' }
        status:
          type: string
          enum: [queued, running, completed, deferred, failed]
        currentStage: { type: string }
        factsCount: { type: integer, minimum: 0 }
        error: { type: string }
        createdAt: { type: string }
        startedAt: { type: string }
        completedAt: { type: string }
        updatedAt: { type: string }
    IntegrationProjection:
      type: object
      additionalProperties: false
      required: [id, name, provider, status]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        status: { $ref: '#/components/schemas/IntegrationStatus' }
    IntegrationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationProjection'
    IntegrationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IntegrationProjection'
    IntegrationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/IntegrationStatus' }
    WorkflowStartRequest:
      type: object
      additionalProperties: false
      required: [workflowType]
      properties:
        workflowType:
          type: string
          enum: [encois.user-blueprint.v1, CoordinatorWorkflow, BootstrapProjectWorkflow]
        version: { type: string, maxLength: 128 }
        key: { type: string, maxLength: 128 }
        blueprintId: { type: string, maxLength: 128 }
        blueprintVersion: { type: string, maxLength: 128 }
        idempotencyKey: { type: string, maxLength: 128 }
        input: { type: object }
        scope: { type: object }
        blueprint: { type: object }
    WorkflowExecutionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [workflowId, workflowType, namespace, taskQueue, status, organizationId, createdAt, updatedAt]
          properties:
            workflowId: { type: string }
            runId: { type: string }
            workflowType: { type: string }
            namespace: { type: string }
            taskQueue: { type: string }
            blueprintId: { type: string }
            status: { type: string, enum: [queued, running, waiting, partial, failed, completed, cancelled] }
            statusReason:
              type: string
              enum: [temporary_error, missing_credentials, human_approval, capability_unavailable, provider_unavailable, invalid_input, degraded_evidence]
            statusMessage: { type: string }
            retryAt: { type: string }
            organizationId: { type: string }
            reused: { type: boolean }
            createdAt: { type: string }
            updatedAt: { type: string }
    WorkflowExecutionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowExecutionProjection'
    WorkflowExecutionProjection:
      type: object
      required: [workflowId, workflowType, namespace, taskQueue, status, organizationId, createdAt, updatedAt]
      properties:
        workflowId: { type: string }
        runId: { type: string }
        workflowType: { type: string }
        blueprintId: { type: string }
        namespace: { type: string }
        taskQueue: { type: string }
        status: { type: string }
        statusReason: { type: string }
        statusMessage: { type: string }
        retryAt: { type: string }
        organizationId: { type: string }
        reused: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    WorkflowSignalRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, signalName, signalId, payload]
      properties:
        contractVersion: { const: workflow-signal.v1 }
        signalName: { const: blueprint-approval }
        signalId: { type: string, minLength: 1, maxLength: 128 }
        payload:
          type: object
          additionalProperties: false
          required: [stepId, approved]
          properties:
            stepId: { type: string, minLength: 1 }
            approved: { type: boolean }
            reason: { type: string, maxLength: 2000 }
    WorkflowSignalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted: { type: boolean }
    WorkflowUpdateRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, updateName, updateId, payload]
      properties:
        contractVersion:
          const: workflow-update.v1
        updateName:
          const: blueprint-context
        updateId:
          type: string
          minLength: 1
          maxLength: 128
        payload:
          type: object
          additionalProperties: false
          required: [businessInput]
          properties:
            businessInput:
              type: object
            reason:
              type: string
              maxLength: 2000
    WorkflowUpdateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted, updateId]
          properties:
            accepted: { type: boolean }
            updateId: { type: string }
    CoordinatorEvent:
      type: object
      additionalProperties: false
      required: [contractVersion, eventId, eventType, coordinatorId, organizationId]
      properties:
        contractVersion:
          const: coordinator-event.v1
        eventId: { type: string, minLength: 1, maxLength: 128 }
        eventType:
          enum: [workflow-plan-approved, workflow-plan-applied, workflow-completed, integration-connected, source-ready, reconcile-requested, provider-changed]
        coordinatorId: { type: string, minLength: 1 }
        organizationId: { type: string, minLength: 1 }
        actorId: { type: string, minLength: 1 }
        planId: { type: string, minLength: 1 }
        approved: { type: boolean }
        blueprintId: { type: string, minLength: 1 }
        blueprintVersion: { type: string, minLength: 1 }
        workflowId: { type: string, minLength: 1 }
        key: { type: string, minLength: 1 }
        businessInput: { type: object }
        scope:
          type: object
          additionalProperties: false
          required: [ids]
          properties:
            ids:
              type: array
              minItems: 1
              items: { type: string, minLength: 1 }
        reason: { type: string, maxLength: 2000 }
        evidenceRefs:
          type: array
          items: { type: string, minLength: 1 }
        workflowStarts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [blueprintId, blueprintVersion, key]
            properties:
              blueprintId: { type: string, minLength: 1 }
              blueprintVersion: { type: string, minLength: 1 }
              key: { type: string, minLength: 1, maxLength: 128 }
              businessInput: { type: object }
              scope:
                type: object
                additionalProperties: false
                required: [ids]
                properties:
                  ids:
                    type: array
                    minItems: 1
                    items: { type: string, minLength: 1 }
    WorkflowStartIntent:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        businessInput: { type: object }
    WorkflowChangePlan:
      type: object
      additionalProperties: false
      required: [contractVersion, planId, coordinatorId, organizationId, observedAt, changes]
      properties:
        contractVersion:
          const: workflow-change-plan.v1
        planId: { type: string }
        coordinatorId: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        observedAt: { type: string }
        evidenceRefs:
          type: array
          items: { type: string }
        changes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind, reason, requiresApproval]
            properties:
              kind: { enum: [create, update, deprecate, cancel] }
              targetBlueprintId: { type: string }
              targetBlueprintVersion: { type: string }
              targetWorkflowId: { type: string }
              blueprint: { type: object }
              start: { $ref: '#/components/schemas/WorkflowStartIntent' }
              reason: { type: string }
              evidenceRefs:
                type: array
                items: { type: string }
              requiresApproval: { type: boolean }
    WorkflowChangePlanRequest:
      $ref: '#/components/schemas/WorkflowChangePlan'
    WorkflowPlanValidationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [planId, organizationId, changeCount, approvalRequired, status, applyStatus]
          properties:
            planId: { type: string }
            organizationId: { type: string }
            changeCount: { type: integer }
            approvalRequired: { type: boolean }
            status: { const: validated_not_applied }
            applyStatus: { const: deferred_persistence_and_approval }
    WorkflowPlanResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [planId, organizationId, coordinatorId, status, approvalRequired, plan, createdAt, updatedAt]
          properties:
            planId: { type: string }
            organizationId: { type: string }
            coordinatorId: { type: string }
            projectId: { type: string }
            status: { enum: [proposed, approved, rejected, applied, expired] }
            approvalRequired: { type: boolean }
            plan: { $ref: '#/components/schemas/WorkflowChangePlanRequest' }
            submittedByUserId: { type: string }
            approvedByUserId: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
            approvedAt: { type: string }
            appliedAt: { type: string }
