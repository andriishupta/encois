openapi: 3.1.0
info:
  title: Encois Gateway API
  version: 0.1.0
paths:
  /api/v1/workflows:
    post:
      operationId: startWorkflow
      summary: Start a registered workflow or generic Blueprint execution
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '202':
          description: Workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
  /api/v1/workflows/release-investigations:
    post:
      operationId: startReleaseInvestigation
      summary: Start or reuse a release investigation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseInvestigationRequest'
      responses:
        '202':
          description: New workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseInvestigationResponse'
        '200':
          description: Existing active workflow reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseInvestigationResponse'
  /api/v1/internal/coordinator/plans/validate:
    post:
      operationId: validateCoordinatorWorkflowChangePlan
      summary: Validate a Coordinator proposal through the private service boundary
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '200':
          description: Plan validated but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanValidationResponse'
  /api/v1/internal/coordinator/plans:
    post:
      operationId: submitCoordinatorWorkflowChangePlan
      summary: Submit a Coordinator proposal through the private service boundary
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '202':
          description: Proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/internal/coordinator/workflows:
    post:
      operationId: startCoordinatorApprovedWorkflow
      summary: Start a generic Workflow from an approved Blueprint registry snapshot
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '202':
          description: Approved workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
  /api/v1/workflows/{workflowId}/updates:
    post:
      operationId: updateWorkflowContext
      summary: Apply scoped context to an active workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdateRequest'
      responses:
        '200':
          description: Update accepted and completed by Temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowUpdateResponse'
  /api/v1/workflows/plans/validate:
    post:
      operationId: validateWorkflowChangePlan
      summary: Validate a proposed workflow change without applying it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '200':
          description: Plan validated but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanValidationResponse'
  /api/v1/workflows/plans:
    post:
      operationId: submitWorkflowChangePlan
      summary: Persist a validated workflow change proposal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '202':
          description: New proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
        '200':
          description: Idempotent replay of an existing proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/{planId}/approve:
    post:
      operationId: approveWorkflowChangePlan
      summary: Approve a persisted workflow change proposal
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal approved but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/{planId}/apply:
    post:
      operationId: applyWorkflowChangePlan
      summary: Apply an approved workflow change plan to the Blueprint registry or execution
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved workflow change applied; unsupported target operations return a stable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceTokenAuth:
      type: apiKey
      in: header
      name: X-Encois-Service-Token
  parameters:
    OrganizationHeader:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
  schemas:
    WorkflowStartRequest:
      type: object
      additionalProperties: false
      required: [workflowType]
      properties:
        workflowType:
          type: string
          enum: [encois.user-blueprint.v1, CoordinatorWorkflow, BootstrapProjectWorkflow]
        version: { type: string, maxLength: 128 }
        key: { type: string, maxLength: 128 }
        blueprintId: { type: string, maxLength: 128 }
        blueprintVersion: { type: string, maxLength: 128 }
        idempotencyKey: { type: string, maxLength: 128 }
        input: { type: object }
        scope: { type: object }
        blueprint: { type: object }
    WorkflowExecutionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [workflowId, workflowType, status, organizationId]
          properties:
            workflowId: { type: string }
            runId: { type: string }
            workflowType: { type: string }
            namespace: { type: string }
            taskQueue: { type: string }
            blueprintId: { type: string }
            status: { type: string }
            organizationId: { type: string }
            reused: { type: boolean }
    ReleaseInvestigationRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, projectKey, releaseKey]
      properties:
        contractVersion:
          const: release-investigation.v1
        projectKey:
          type: string
        releaseKey:
          type: string
        targetDate:
          type: string
        idempotencyKey:
          type: string
        scope:
          type: object
    ReleaseInvestigationResponse:
      type: object
      required: [contractVersion, workflow, reused]
      properties:
        contractVersion:
          const: release-investigation.v1
        reused:
          type: boolean
        workflow:
          type: object
          required: [workflowId, workflowType, status, organizationId]
          properties:
            workflowId: { type: string }
            runId: { type: string }
            workflowType: { type: string }
            blueprintId: { type: string }
            status: { type: string }
            organizationId: { type: string }
    WorkflowUpdateRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, updateName, updateId, payload]
      properties:
        contractVersion:
          const: workflow-update.v1
        updateName:
          const: blueprint-context
        updateId:
          type: string
          minLength: 1
          maxLength: 128
        payload:
          type: object
          additionalProperties: false
          required: [businessInput]
          properties:
            businessInput:
              type: object
            reason:
              type: string
              maxLength: 2000
    WorkflowUpdateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted, updateId]
          properties:
            accepted: { type: boolean }
            updateId: { type: string }
    CoordinatorEvent:
      type: object
      additionalProperties: false
      required: [contractVersion, eventId, eventType, coordinatorId, organizationId]
      properties:
        contractVersion:
          const: coordinator-event.v1
        eventId: { type: string, minLength: 1, maxLength: 128 }
        eventType:
          enum: [workflow-plan-approved, workflow-plan-applied, workflow-completed, integration-connected, source-ready, reconcile-requested, provider-changed]
        coordinatorId: { type: string, minLength: 1 }
        organizationId: { type: string, minLength: 1 }
        actorId: { type: string, minLength: 1 }
        planId: { type: string, minLength: 1 }
        approved: { type: boolean }
        blueprintId: { type: string, minLength: 1 }
        blueprintVersion: { type: string, minLength: 1 }
        workflowId: { type: string, minLength: 1 }
        key: { type: string, minLength: 1 }
        businessInput: { type: object }
        scope:
          type: object
          additionalProperties: false
          required: [ids]
          properties:
            ids:
              type: array
              minItems: 1
              items: { type: string, minLength: 1 }
            projectIds:
              type: array
              items: { type: string, minLength: 1 }
            teamIds:
              type: array
              items: { type: string, minLength: 1 }
        reason: { type: string, maxLength: 2000 }
        evidenceRefs:
          type: array
          items: { type: string, minLength: 1 }
        workflowStarts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [blueprintId, blueprintVersion, key]
            properties:
              blueprintId: { type: string, minLength: 1 }
              blueprintVersion: { type: string, minLength: 1 }
              key: { type: string, minLength: 1, maxLength: 128 }
              businessInput: { type: object }
    WorkflowStartIntent:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        businessInput: { type: object }
    WorkflowChangePlan:
      type: object
      additionalProperties: false
      required: [contractVersion, planId, coordinatorId, organizationId, observedAt, changes]
      properties:
        contractVersion:
          const: workflow-change-plan.v1
        planId: { type: string }
        coordinatorId: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        observedAt: { type: string }
        evidenceRefs:
          type: array
          items: { type: string }
        changes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind, reason, requiresApproval]
            properties:
              kind: { enum: [create, update, deprecate, cancel] }
              targetWorkflowId: { type: string }
              blueprint: { type: object }
              start: { $ref: '#/components/schemas/WorkflowStartIntent' }
              reason: { type: string }
              evidenceRefs:
                type: array
                items: { type: string }
              requiresApproval: { type: boolean }
    WorkflowChangePlanV2:
      type: object
      additionalProperties: false
      required: [contractVersion, planId, coordinatorId, organizationId, observedAt, changes]
      properties:
        contractVersion:
          const: workflow-change-plan.v2
        planId: { type: string }
        coordinatorId: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        observedAt: { type: string }
        evidenceRefs:
          type: array
          items: { type: string }
        changes:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [kind, blueprint, reason, requiresApproval]
                properties:
                  kind: { const: create }
                  blueprint: { type: object }
                  start: { $ref: '#/components/schemas/WorkflowStartIntent' }
                  reason: { type: string }
                  evidenceRefs:
                    type: array
                    items: { type: string }
                  requiresApproval: { type: boolean }
              - type: object
                additionalProperties: false
                required: [kind, targetBlueprintId, targetBlueprintVersion, blueprint, reason, requiresApproval]
                properties:
                  kind: { const: update }
                  targetBlueprintId: { type: string }
                  targetBlueprintVersion: { type: string }
                  blueprint: { type: object }
                  start: { $ref: '#/components/schemas/WorkflowStartIntent' }
                  reason: { type: string }
                  evidenceRefs:
                    type: array
                    items: { type: string }
                  requiresApproval: { type: boolean }
              - type: object
                additionalProperties: false
                required: [kind, targetBlueprintId, targetBlueprintVersion, reason, requiresApproval]
                properties:
                  kind: { const: deprecate }
                  targetBlueprintId: { type: string }
                  targetBlueprintVersion: { type: string }
                  reason: { type: string }
                  evidenceRefs:
                    type: array
                    items: { type: string }
                  requiresApproval: { type: boolean }
              - type: object
                additionalProperties: false
                required: [kind, targetWorkflowId, reason, requiresApproval]
                properties:
                  kind: { const: cancel }
                  targetWorkflowId: { type: string }
                  reason: { type: string }
                  evidenceRefs:
                    type: array
                    items: { type: string }
                  requiresApproval: { type: boolean }
    WorkflowChangePlanRequest:
      oneOf:
        - $ref: '#/components/schemas/WorkflowChangePlan'
        - $ref: '#/components/schemas/WorkflowChangePlanV2'
    WorkflowPlanValidationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [planId, organizationId, changeCount, approvalRequired, status, applyStatus]
          properties:
            planId: { type: string }
            organizationId: { type: string }
            changeCount: { type: integer }
            approvalRequired: { type: boolean }
            status: { const: validated_not_applied }
            applyStatus: { const: deferred_persistence_and_approval }
    WorkflowPlanResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [planId, organizationId, coordinatorId, status, approvalRequired, plan, createdAt, updatedAt]
          properties:
            planId: { type: string }
            organizationId: { type: string }
            coordinatorId: { type: string }
            projectId: { type: string }
            status: { enum: [proposed, approved, rejected, applied, expired] }
            approvalRequired: { type: boolean }
            plan: { $ref: '#/components/schemas/WorkflowChangePlanRequest' }
            submittedByUserId: { type: string }
            approvedByUserId: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
            approvedAt: { type: string }
            appliedAt: { type: string }
