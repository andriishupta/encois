        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
    WorkflowBlueprintListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkflowBlueprintProjection' }
    WorkflowBlueprintLifecycleRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, action, reason]
      properties:
        contractVersion: { const: workflow-blueprint-lifecycle.v1 }
        action: { enum: [create_revision, duplicate, deprecate, restore, mark_current] }
        sourceVersion: { type: string, minLength: 1, maxLength: 32 }
        version: { type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$', maxLength: 32 }
        name: { type: string, minLength: 2, maxLength: 160 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
    WorkflowCreationIntent:
      type: object
      additionalProperties: false
      required: [mode, name]
      properties:
        mode: { enum: [template, blueprint, manual] }
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        businessKey: { type: string, maxLength: 128 }
        templateKey: { type: string, maxLength: 128 }
        blueprintKey: { type: string, maxLength: 128 }
        prompt: { type: string, maxLength: 4000 }
        businessInput: { type: object }
        scope:
          type: object
          additionalProperties: false
          properties:
            ids:
              type: array
              minItems: 1
              items: { type: string }
        start: { type: boolean }
    WorkflowCreationPreview:
      type: object
      required: [intent, plan, blueprint, source, warnings, requiredCapabilities, providerBindings, approvalRequired]
      properties:
        intent: { $ref: '#/components/schemas/WorkflowCreationIntent' }
        plan: { $ref: '#/components/schemas/WorkflowChangePlan' }
        blueprint: { $ref: '#/components/schemas/WorkflowBlueprint' }
        source:
          type: object
          required: [kind, title]
          properties:
            kind: { enum: [template, blueprint, manual] }
            key: { type: string }
            title: { type: string }
        warnings:
          type: array
          items: { type: string }
        requiredCapabilities:
          type: array
          items: { type: string }
        providerBindings:
          type: array
          items:
            type: object
            required: [slotKey, required, status, capabilities]
            properties:
              slotKey: { type: string }
              required: { type: boolean }
              status: { enum: [ready, missing] }
              provider: { type: string }
              integrationName: { type: string }
              capabilities:
                type: array
                items: { type: string }
        approvalRequired: { type: boolean }
    WorkflowCreationPreviewResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WorkflowCreationPreview' }
    WorkflowStartIntent:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        businessInput: { type: object }
    WorkflowChangePlan:
      type: object
      additionalProperties: false
      required: [contractVersion, planId, coordinatorId, organizationId, observedAt, changes]
      properties:
        contractVersion:
          const: workflow-change-plan.v1
        planId: { type: string }
        coordinatorId: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        scope: { $ref: '#/components/schemas/ExecutionScope' }
        observedAt: { type: string }
        metadata: { $ref: '#/components/schemas/WorkflowPlanMetadata' }
        evidenceRefs:
          type: array
          items: { type: string }
        changes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind, reason, requiresApproval]
            properties:
              kind: { enum: [create, update, deprecate, restore, set_current, cancel] }
              targetBlueprintId: { type: string }
              targetBlueprintVersion: { type: string }
              targetWorkflowId: { type: string }
              blueprint: { type: object }
              start: { $ref: '#/components/schemas/WorkflowStartIntent' }
              reason: { type: string }
              evidenceRefs:
                type: array
                items: { type: string }
              requiresApproval: { type: boolean }
    WorkflowPlanMetadata:
      type: object
      additionalProperties: false
      required: [planner]
      properties:
        planner:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            version: { type: string, minLength: 1, maxLength: 80 }
        sourceSchemaVersion: { type: string, minLength: 1, maxLength: 120 }
        promptVersion: { type: string, minLength: 1, maxLength: 120 }
        promptHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    WorkflowChangePlanRequest:
      $ref: '#/components/schemas/WorkflowChangePlan'
    WorkflowPlanValidationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [planId, organizationId, changeCount, approvalRequired, status, applyStatus]
          properties:
            planId: { type: string }
            organizationId: { type: string }
            changeCount: { type: integer }
            approvalRequired: { type: boolean }
            status: { const: validated_not_applied }
            applyStatus: { const: deferred_persistence_and_approval }
    WorkflowPlanResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WorkflowPlanRecord' }
    WorkflowPlanListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkflowPlanRecord' }
    WorkflowPlanRecord:
      type: object
      required: [planId, organizationId, coordinatorId, status, approvalRequired, plan, createdAt, updatedAt]
      properties:
        planId: { type: string }
        organizationId: { type: string }
        coordinatorId: { type: string }
        projectId: { type: string }
        status: { enum: [proposed, approved, rejected, applied, expired] }
        approvalRequired: { type: boolean }
        plan: { $ref: '#/components/schemas/WorkflowChangePlanRequest' }
        submittedByUserId: { type: string }
        approvedByUserId: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        approvedAt: { type: string }
        appliedAt: { type: string }
