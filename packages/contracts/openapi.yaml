openapi: 3.1.0
info:
  title: Encois Gateway API
  version: 1.0.0
paths:
  /api/v1/auth/me:
    get:
      operationId: getAuthenticationStatus
      summary: Resolve the authenticated Identity Platform user to Encois access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active access or a valid identity awaiting an Encois invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          description: Missing or invalid Identity Platform token
        '503':
          description: Authentication or access provisioning is unavailable
  /api/v1/public/waitlist:
    post:
      operationId: submitWaitlistRequest
      summary: Request access to the invite-only Encois product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistSubmissionResponse'
        '400':
          description: Invalid request
        '429':
          description: Rate limit exceeded
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      summary: List integrations visible in the caller's effective scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped integration projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListResponse'
    post:
      operationId: createIntegration
      summary: Register a pending read-only integration and bind it to an organization unit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreateRequest'
      responses:
        '201':
          description: Pending integration registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
  /api/v1/integrations/{integrationId}:
    post:
      operationId: updateIntegration
      summary: Update integration control-plane metadata
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdateRequest'
      responses:
        '200':
          description: Updated integration projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
  /api/v1/integrations/{integrationId}/webhook:
    get:
      operationId: getIntegrationWebhookEndpoint
      summary: Read the scoped webhook endpoint projection for an integration
      description: Returns endpoint metadata only. The signing secret is never returned by a read operation.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Webhook endpoint metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointResponse' }
        '403': { description: Caller cannot read this integration }
        '404': { description: Webhook endpoint or integration is not visible in the caller's scope }
        '503': { description: Persistence is not configured }
    post:
      operationId: provisionIntegrationWebhookEndpoint
      summary: Provision or repair the signed webhook endpoint for an integration
      description: The API generates and stores the signing secret in Secret Manager. The response contains the secret once so an administrator can configure the provider; it is not persisted in the dashboard or returned by later reads.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEndpointProvisionRequest' }
      responses:
        '201':
          description: Endpoint provisioned with one-time signing secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointSecretResponse' }
        '403': { description: Caller cannot manage this integration }
        '404': { description: Integration is not visible in the caller's scope }
        '409': { description: Endpoint already exists or integration is not active }
        '503': { description: Persistence or Secret Manager is not configured }
  /api/v1/integrations/{integrationId}/webhook/rotate:
    post:
      operationId: rotateIntegrationWebhookSecret
      summary: Rotate the signing secret for an integration webhook endpoint
      description: Adds a new Secret Manager version and returns the replacement secret once. The endpoint remains enabled after a successful rotation.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Endpoint with one-time replacement secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointSecretResponse' }
        '403': { description: Caller cannot manage this integration }
        '404': { description: Endpoint or integration is not visible in the caller's scope }
        '409': { description: Endpoint is disabled }
        '503': { description: Persistence or Secret Manager is not configured }
  /api/v1/integrations/{integrationId}/webhook/enable:
    post:
      operationId: enableIntegrationWebhookEndpoint
      summary: Enable an integration webhook endpoint
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Enabled endpoint projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointResponse' }
        '403': { description: Caller cannot manage this integration }
        '404': { description: Endpoint or integration is not visible in the caller's scope }
        '409': { description: Endpoint has no configured signing secret }
  /api/v1/integrations/{integrationId}/webhook/disable:
    post:
      operationId: disableIntegrationWebhookEndpoint
      summary: Disable an integration webhook endpoint
      description: Disabling makes the public ingress reject provider deliveries while preserving the endpoint and Secret Manager versions for an auditable recovery.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Disabled endpoint projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointResponse' }
        '403': { description: Caller cannot manage this integration }
        '404': { description: Endpoint or integration is not visible in the caller's scope }
  /api/v1/integrations/{integrationId}/authorization/start:
    post:
      operationId: startIntegrationAuthorization
      summary: Start provider authorization without exposing credentials to the browser
      description: The configured provider adapter owns OAuth, callback, and Secret Manager provisioning. The browser receives only a trusted provider redirect or a pending state.
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider authorization handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAuthorizationStartResponse'
        '403':
          description: Caller cannot manage this integration
        '404':
          description: Integration not found in the caller's scope
        '503':
          description: Provider authorization adapter is not configured
  /api/v1/integrations/authorization/callback:
    get:
      operationId: completeIntegrationAuthorization
      summary: Complete a provider authorization callback
      description: Public OAuth callback protected by a signed, one-time state. The callback never accepts credentials from the browser and redirects back to the dashboard after Secret Manager provisioning.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '303':
          description: Authorization completed and the browser is redirected to the integration detail view
        '400':
          description: Invalid, expired, denied, or replayed authorization state
        '502':
          description: Provider token exchange or Secret Manager provisioning failed
        '503':
          description: Authorization adapter or persistence is not configured
  /api/v1/webhooks/{organizationId}/{endpointKey}:
    post:
      operationId: receiveWebhookEvent
      summary: Receive a signed provider webhook and enqueue scoped source ingestion
      description: Public provider ingress. The request body is signed raw bytes; the gateway validates the signature, retains the payload in Cloud Storage, deduplicates the provider event, and starts the existing source-ingestion workflow without exposing runtime identifiers.
      security: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: endpointKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: X-Encois-Event-Id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: X-Encois-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[A-Fa-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
          text/plain: { schema: { type: string } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '202':
          description: Event accepted and source ingestion started or is being processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceiptResponse' }
        '200':
          description: Previously received event; no duplicate ingestion was started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceiptResponse' }
        '400': { description: Missing or malformed event headers }
        '401': { description: Invalid webhook signature }
        '404': { description: Endpoint not found }
        '413': { description: Payload exceeds the 1 MiB ingress limit }
        '415': { description: Unsupported content type }
        '503': { description: Persistence, Secret Manager, Cloud Storage, or workflow runtime is unavailable }
  /api/v1/internal/integrations/{integrationId}/authorization:
    post:
      operationId: updateIntegrationAuthorization
      summary: Complete provider authorization with a Secret Manager reference
      description: Private provider-adapter boundary. Raw credentials are never accepted or returned.
      security:
        - serviceTokenAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationAuthorizationUpdate'
      responses:
        '200':
          description: Updated authorization lifecycle projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '401':
          description: Internal service authentication failed
        '422':
          description: Invalid credential reference or lifecycle state
  /api/v1/internal/integrations/credentials/resolve:
    post:
      operationId: resolveIntegrationCredential
      summary: Resolve a scoped provider capability to a Secret Manager reference
      description: Private Agent Gateway boundary. The response contains only a Secret Manager reference; provider tokens are never returned.
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCredentialResolutionRequest'
      responses:
        '200':
          description: Scoped provider credential reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCredentialResolutionResponse'
        '401':
          description: Internal service authentication failed
        '404':
          description: No active, scoped integration satisfies the provider capability
        '503':
          description: Persistence is not configured
  /api/v1/internal/integrations/health:
    post:
      operationId: reportIntegrationHealth
      summary: Report provider health from the private Agent Gateway
      description: Private data-plane callback. It updates lifecycle state and audit metadata without exposing credentials to the dashboard.
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationHealthUpdate'
      responses:
        '200':
          description: Updated integration lifecycle projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          description: Invalid health update payload
        '401':
          description: Internal service authentication failed
        '404':
          description: Integration not found in the organization
        '502':
          description: Health update could not be persisted
        '503':
          description: Persistence is not configured
  /api/v1/internal/integrations/health-check:
    post:
      operationId: runIntegrationHealthCheck
      summary: Run bounded provider health probes for an organization
      description: Private scheduler boundary. The API enumerates active scoped integrations and asks the private Agent Gateway to probe each provider without exposing credentials.
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationHealthCheckRequest'
      responses:
        '200':
          description: Bounded health-check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationHealthCheckResponse'
        '400':
          description: Invalid health-check payload
        '401':
          description: Internal service authentication failed
        '503':
          description: Persistence or Agent Gateway is not configured
  /api/v1/organization:
    get:
      operationId: getOrganization
      summary: Get the organization structure and scoped details available to the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization structure, scoped unit details, visible members, and manageable permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/v1/organization/onboarding:
    patch:
      operationId: updateOrganizationOnboarding
      summary: Update the organization onboarding configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationOnboardingUpdateRequest'
      responses:
        '200':
          description: Onboarding configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOnboardingResponse'
        '403': { description: onboarding:manage is required }
  /api/v1/organization/onboarding/start:
    post:
      operationId: startOrganizationOnboarding
      summary: Start the organization Coordinator
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Coordinator accepted and onboarding marked ready for dashboard use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOnboardingResponse'
        '403': { description: onboarding:manage is required }
        '503': { description: Coordinator or persistence is unavailable }
  /api/v1/organization/units:
    get:
      operationId: listOrganizationUnits
      summary: List the organization structure with caller-specific view and management flags
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization units with structural metadata; scoped details are returned only for accessible units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitListResponse'
    post:
      operationId: createOrganizationUnit
      summary: Create a child organization unit inside the caller's management scope
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUnitCreateRequest'
      responses:
        '201':
          description: Created organization unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitResponse'
  /api/v1/organization/members:
    get:
      operationId: listOrganizationMembers
      summary: List organization members visible to the caller's management scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible organization members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberListResponse'
  /api/v1/organization/permissions:
    get:
      operationId: listOrganizationPermissions
      summary: List direct membership permissions manageable by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Manageable direct membership permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPermissionListResponse'
    post:
      operationId: createOrganizationPermission
      summary: Create or update a direct membership permission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPermissionCreateRequest'
      responses:
        '201':
          description: Created or updated direct permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPermissionResponse'
  /api/v1/organization/permissions/{permissionId}:
    patch:
      operationId: updateOrganizationPermission
      summary: Change a direct membership permission's access level
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPermissionUpdateRequest'
      responses:
        '200':
          description: Updated direct permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPermissionResponse'
    delete:
      operationId: deleteOrganizationPermission
      summary: Remove a direct membership permission
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permission removed and audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
  /api/v1/context/graph/query:
    post:
      operationId: queryContextGraph
      summary: Inspect the organization-scoped Spanner Graph projection
      description: The browser-facing query is allowlisted; provider SQL and Agent Gateway credentials are never accepted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphInspectionQueryRequest'
      responses:
        '200':
          description: Read-only graph projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphInspectionResponse'
        '403':
          description: Organization management permission or scope is required
        '503':
          description: Graph data plane is unavailable or not configured
  /api/v1/context/memory/query:
    post:
      operationId: queryAgentMemory
      summary: Inspect tenant-scoped agent memory through the private Agent Runtime
      description: Read-only administrative retrieval. Memory generation and deletion are not exposed to the browser.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryInspectionQueryRequest'
      responses:
        '200':
          description: Read-only agent memory projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryInspectionResponse'
        '403':
          description: Organization management permission or scope is required
        '503':
          description: Agent Runtime or memory provider is unavailable
  /api/v1/sources:
    get:
      operationId: listKnowledgeSources
      summary: List Sources visible in the caller's scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped Sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceListResponse'
    post:
      operationId: createKnowledgeSource
      summary: Register a scoped Source
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSourceCreateRequest'
      responses:
        '201':
          description: Source registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceResponse'
  /api/v1/sources/uploads:
    post:
      operationId: uploadKnowledgeSourcePdf
      summary: Upload a PDF as a new Source and immutable revision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file, maximum 10 MiB
                name:
                  type: string
                  maxLength: 120
                readScope:
                  type: string
                  description: JSON-encoded KnowledgeSourceScope object
                visibilityScope:
                  type: string
                  description: JSON-encoded KnowledgeSourceScope object
      responses:
        '201':
          description: Source and immutable revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceUploadResponse'
  /api/v1/sources/{sourceId}:
    get:
      operationId: getKnowledgeSource
      summary: Get a Source and its immutable revisions
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceDetailResponse'
        '404':
          description: Source not found
  /api/v1/sources/{sourceId}/revisions:
    post:
      operationId: createSourceRevision
      summary: Register an immutable source revision by artifact/provider reference
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRevisionCreateRequest'
      responses:
        '201':
          description: Revision registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRevisionResponse'
  /api/v1/sources/{sourceId}/revisions/{revisionId}/ingest:
    post:
      operationId: startSourceIngestion
      summary: Start the platform-owned source ingestion Workflow
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trigger:
                  $ref: '#/components/schemas/SourceIngestionTrigger'
      responses:
        '202':
          description: Ingestion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceIngestionLaunchResponse'
  /api/v1/workflows:
    post:
      operationId: startWorkflow
      summary: Start a registered workflow or generic Blueprint execution
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '202':
          description: Workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
    get:
      operationId: listWorkflows
      summary: List workflow projections visible in the caller's effective scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped workflow projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionListResponse'
  /api/v1/workflows/activity:
    get:
      operationId: listWorkflowActivity
      summary: List recent workflow events visible in the caller's effective scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scoped recent workflow activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRecentActivityListResponse'
  /api/v1/internal/coordinator/plans/validate:
    post:
      operationId: validateCoordinatorWorkflowChangePlan
      summary: Validate a Coordinator proposal through the private service boundary
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '200':
          description: Plan validated but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanValidationResponse'
  /api/v1/internal/coordinator/plans:
    post:
      operationId: submitCoordinatorWorkflowChangePlan
      summary: Submit a Coordinator proposal through the private service boundary
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '202':
          description: Proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/internal/coordinator/workflows:
    post:
      operationId: startCoordinatorApprovedWorkflow
      summary: Start a generic Workflow from an approved Blueprint registry snapshot
      security:
        - serviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '202':
          description: Approved workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
  /api/v1/workflows/{workflowId}/updates:
    post:
      operationId: updateWorkflowContext
      summary: Apply scoped context to an active workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdateRequest'
      responses:
        '200':
          description: Update accepted and completed by Temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowUpdateResponse'
  /api/v1/workflows/{workflowId}:
    get:
      operationId: getWorkflow
      summary: Read a tenant-authorized workflow projection
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
  /api/v1/workflows/{workflowId}/events:
    get:
      operationId: getWorkflowEvents
      summary: Read activity, evidence, and lifecycle events for a workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scoped workflow events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowEventListResponse'
  /api/v1/workflows/{workflowId}/signals:
    post:
      operationId: signalWorkflow
      summary: Send an authorized workflow Signal
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowSignalRequest'
      responses:
        '200':
          description: Signal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSignalResponse'
  /api/v1/workflows/{workflowId}/cancel:
    post:
      operationId: cancelWorkflow
      summary: Request cancellation of an active workflow run
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSignalResponse'
        '409':
          description: Workflow is already terminal or cannot be cancelled
  /api/v1/workflows/{workflowId}/rerun:
    post:
      operationId: rerunWorkflow
      summary: Start a new run from a terminal workflow's persisted revision
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: New run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'
        '409':
          description: Parent run is not rerunnable or its Blueprint revision is unavailable
  /api/v1/workflows/templates:
    get:
      operationId: listWorkflowTemplates
      summary: List non-deleted workflow Templates available in the caller scope
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Active and disabled workflow Templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateListResponse'
  /api/v1/workflows/blueprints:
    get:
      operationId: listWorkflowBlueprints
      summary: List tenant-scoped Blueprint registry entries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Blueprint registry projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowBlueprintListResponse'
  /api/v1/workflows/blueprints/{blueprintId}/lifecycle:
    post:
      operationId: proposeWorkflowBlueprintLifecycleChange
      summary: Submit an audited Blueprint revision or deprecation proposal
      security:
        - bearerAuth: []
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowBlueprintLifecycleRequest'
      responses:
        '202':
          description: Lifecycle proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
        '200':
          description: Idempotent replay of an existing lifecycle proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/preview:
    post:
      operationId: previewWorkflowCreation
      summary: Resolve a product-level workflow creation intent into a reviewable plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreationIntent'
      responses:
        '200':
          description: Resolved workflow plan preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCreationPreviewResponse'
  /api/v1/workflows/plans/from-intent:
    post:
      operationId: submitWorkflowCreationIntent
      summary: Persist a workflow change plan resolved from a product-level intent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreationIntent'
      responses:
        '202':
          description: Workflow plan persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/validate:
    post:
      operationId: validateWorkflowChangePlan
      summary: Validate a proposed workflow change without applying it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '200':
          description: Plan validated but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanValidationResponse'
  /api/v1/workflows/plans:
    get:
      operationId: listWorkflowChangePlans
      summary: List tenant-visible persisted workflow change proposals
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Persisted proposals visible in the caller's organization and execution scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanListResponse'
    post:
      operationId: submitWorkflowChangePlan
      summary: Persist a validated workflow change proposal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowChangePlanRequest'
      responses:
        '202':
          description: New proposal persisted and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
        '200':
          description: Idempotent replay of an existing proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/{planId}/approve:
    post:
      operationId: approveWorkflowChangePlan
      summary: Approve a persisted workflow change proposal
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal approved but not applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/workflows/plans/{planId}/apply:
    post:
      operationId: applyWorkflowChangePlan
      summary: Apply an approved workflow change plan to the Blueprint registry or execution
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved workflow change applied; unsupported target operations return a stable error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPlanResponse'
  /api/v1/investigations:
    get:
      operationId: listSavedInvestigations
      summary: List saved investigations owned by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved investigation projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedInvestigationListResponse'
    post:
      operationId: createSavedInvestigation
      summary: Save a bounded graph, memory, or workflow investigation query
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedInvestigationCreateRequest'
      responses:
        '201':
          description: Saved investigation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedInvestigationResponse'
  /api/v1/investigations/{investigationId}:
    delete:
      operationId: deleteSavedInvestigation
      summary: Delete a saved investigation owned by the caller
      security:
        - bearerAuth: []
      parameters:
        - name: investigationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Saved investigation deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '404':
          description: Saved investigation not found
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List current user's in-product operational notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark a notification read
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
  /api/v1/settings/notifications:
    get:
      operationId: getNotificationPreferences
      summary: Get current user's notification preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
    put:
      operationId: updateNotificationPreferences
      summary: Update current user's notification preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Notification preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceTokenAuth:
      type: apiKey
      in: header
      name: X-Encois-Service-Token
  parameters:
    OrganizationHeader:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
  schemas:
    AuthStatusResponse:
      oneOf:
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status, userId, organizationId, permissions]
              properties:
                status: { const: active }
                userId: { type: string }
                organizationId: { type: string }
                permissions:
                  type: array
                  items: { $ref: '#/components/schemas/Permission' }
                displayName: { type: string }
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { const: pending }
    OrganizationUnitType:
      type: string
      enum: [organization, department, team, project, service, custom]
    AccessLevel:
      type: string
      enum: [viewer, contributor, manager, admin]
    Permission:
      type: string
      enum: [onboarding:manage, workflows:read, workflows:run, workflows:manage, integrations:read, integrations:manage, knowledge:read, knowledge:manage, context:read, memory:read, organization:read, organization:manage, settings:read, settings:manage]
    OrganizationMembershipStatus:
      type: string
      enum: [invited, active, suspended]
    OrganizationOnboardingStatus:
      type: string
      enum: [pending, initializing, ready, failed]
    CoordinationMode:
      type: string
      enum: [start-coordinator, connect-only]
    OrganizationUnitProjection:
      type: object
      additionalProperties: false
      required: [id, organizationId, parentId, type, slug, name, description, canView, canManage]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/OrganizationUnitType' }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        canView: { type: boolean, description: The caller may select the unit and read its scoped details. }
        canManage: { type: boolean, description: The caller may manage the unit and its direct permissions. }
        manager: { type: string, description: Present only when canView is true. }
        memberCount: { type: integer, minimum: 0, description: Present only when canView is true. }
    OrganizationMemberProjection:
      type: object
      additionalProperties: false
      required: [id, initials, name, role, roleKey, status]
      properties:
        id: { type: string, format: uuid }
        initials: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        roleKey: { type: string }
        homeUnitId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrganizationMembershipStatus' }
    OrganizationPermissionProjection:
      type: object
      additionalProperties: false
      required: [id, memberId, unitId, access, propagateToChildren]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AccessLevel' }
        propagateToChildren: { const: true }
    OrganizationProjection:
      type: object
      additionalProperties: false
      required: [organization, units, members, permissions, onboarding]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, slug, name]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        units:
          type: array
          items: { $ref: '#/components/schemas/OrganizationUnitProjection' }
        members:
          type: array
          items: { $ref: '#/components/schemas/OrganizationMemberProjection' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/OrganizationPermissionProjection' }
        onboarding: { $ref: '#/components/schemas/OrganizationOnboardingProjection' }
    OrganizationOnboardingProjection:
      type: object
      additionalProperties: false
      required: [organizationId, status, coordinatorId, coordinationMode, selectedWorkflows, createdAt, updatedAt]
      properties:
        organizationId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrganizationOnboardingStatus' }
        coordinatorId: { type: string }
        coordinationMode: { $ref: '#/components/schemas/CoordinationMode' }
        selectedWorkflows:
          description: Published Template keys or current approved Blueprint ids. Runtime and Temporal ids are never accepted here.
          type: array
          maxItems: 50
          items: { type: string, maxLength: 128 }
        lastError: { type: string, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrganizationOnboardingUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        coordinationMode: { $ref: '#/components/schemas/CoordinationMode' }
        selectedWorkflows:
          description: Published Template keys or current approved Blueprint ids. The Gateway validates each reference in the organization scope.
          type: array
          maxItems: 50
          items: { type: string, maxLength: 128 }
    OrganizationOnboardingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationOnboardingProjection' }
    OrganizationUnitCreateRequest:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        parentId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/OrganizationUnitType' }
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 96 }
    OrganizationPermissionCreateRequest:
      type: object
      additionalProperties: false
      required: [memberId, unitId, access]
      properties:
        memberId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AccessLevel' }
    OrganizationPermissionUpdateRequest:
      type: object
      additionalProperties: false
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/AccessLevel' }
    OrganizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationProjection' }
    OrganizationUnitResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationUnitProjection' }
    OrganizationUnitListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationUnitProjection' }
    OrganizationMemberListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationMemberProjection' }
    OrganizationPermissionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrganizationPermissionProjection' }
    OrganizationPermissionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationPermissionProjection' }
    DeletedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { const: true }
    AcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [read]
          properties:
            read: { const: true }
    WebhookReceiptResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [accepted, duplicate, matchedSources, status]
          properties:
            accepted: { const: true }
            duplicate: { type: boolean }
            matchedSources: { type: integer, minimum: 0 }
            status: { type: string, enum: [received, processed] }
    SavedInvestigation:
      type: object
      required: [id, organizationId, name, kind, query, params, scope, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [graph, memory, workflow] }
        query: { type: string }
        params: { type: object, additionalProperties: true }
        scope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        createdAt: { type: string }
        updatedAt: { type: string }
    SavedInvestigationCreateRequest:
      type: object
      additionalProperties: false
      required: [name, kind, query, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [graph, memory, workflow] }
        query: { type: string, minLength: 1, maxLength: 500 }
        params: { type: object, additionalProperties: true }
        scope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
    SavedInvestigationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SavedInvestigation' }
    SavedInvestigationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SavedInvestigation' }
    Notification:
      type: object
      required: [id, type, severity, title, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        title: { type: string }
        message: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        readAt: { type: string }
        createdAt: { type: string }
    NotificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
    NotificationPreferences:
      type: object
      required: [emailEnabled, pushEnabled, workflowUpdates, evidenceReady, weeklyDigest]
      properties:
        emailEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        workflowUpdates: { type: boolean }
        evidenceReady: { type: boolean }
        weeklyDigest: { type: boolean }
        updatedAt: { type: string, readOnly: true }
    NotificationPreferencesResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/NotificationPreferences' }
    WaitlistRequest:
      type: object
      additionalProperties: false
      description: Requires a work email, company name, and at least one company website or company LinkedIn URL.
      required: [email, companyName]
      properties:
        email: { type: string, format: email, maxLength: 320, description: Work email; common personal mailbox providers are rejected }
        displayName: { type: string, maxLength: 160 }
        companyName: { type: string, minLength: 1, maxLength: 160 }
        companyWebsite: { type: string, format: uri, maxLength: 500 }
        companyLinkedinUrl: { type: string, format: uri, maxLength: 500 }
        message: { type: string, maxLength: 2000 }
    WaitlistSubmissionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted: { const: true }
    IntegrationStatus:
      type: string
      enum: [pending, authorized, active, degraded, needs_reauth, disabled, error]
    KnowledgeSourceKind:
      type: string
      enum: [integration, uploaded_document, manual, media]
    KnowledgeSourceStatus:
      type: string
      enum: [draft, connecting, discovering, ingesting, active, degraded, needs_reauth, failed, disabled]
    SourceRevisionStatus:
      type: string
      enum: [pending, ingesting, active, failed, superseded]
    SourceIngestionTrigger:
      type: string
      enum: [bootstrap, manual, webhook, schedule, reconcile]
    KnowledgeSourceScope:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    KnowledgeSource:
      description: Compatibility schema name for the organization-unit-scoped product entity Source.
      type: object
      additionalProperties: false
      required: [contractVersion, id, organizationId, name, kind, status, readScope, visibilityScope, createdAt, updatedAt]
      properties:
        contractVersion: { const: knowledge-source.v1 }
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/KnowledgeSourceKind' }
        provider: { type: string }
        integrationId: { type: string }
        status: { $ref: '#/components/schemas/KnowledgeSourceStatus' }
        readScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        visibilityScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        contentType: { type: string }
        currentRevisionId: { type: string }
        freshness: { $ref: '#/components/schemas/SourceFreshness' }
        createdAt: { type: string }
        updatedAt: { type: string }
    SourceFreshness:
      type: object
      additionalProperties: false
      required: [source, observedAt, status]
      properties:
        source: { type: string }
        observedAt: { type: string }
        ingestedAt: { type: string }
        expiresAt: { type: string }
        status: { type: string, enum: [fresh, stale, unknown] }
    KnowledgeSourceCreateRequest:
      type: object
      additionalProperties: false
      required: [name, kind, readScope, visibilityScope]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: '#/components/schemas/KnowledgeSourceKind' }
        provider: { type: string }
        integrationId: { type: string }
        readScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
        visibilityScope: { $ref: '#/components/schemas/KnowledgeSourceScope' }
