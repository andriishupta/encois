name: encois-watch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: encois
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - encois-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/00-runtime-role.sql:/docker-entrypoint-initdb.d/00-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encois"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/temporal:1.8.2}
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - encois-temporal-data:/tmp
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  firebase-auth:
    build:
      context: .
      dockerfile: docker/firebase/Dockerfile
    ports:
      - "4000:4000"
      - "9099:9099"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrations:
    build:
      context: .
      dockerfile: packages/persistence/Dockerfile
    environment:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@postgres:5432/encois
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  local-auth-seed:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    command: ["node", "dist/local-seed.js"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@postgres:5432/encois
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      IDENTITY_PLATFORM_PROJECT_ID: demo-encois
      LOCAL_AUTH_EMAIL: owner@local.test
      LOCAL_AUTH_PASSWORD: local-password-1234
    depends_on:
      firebase-auth:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: "no"

  agent-gateway:
    build:
      context: .
      dockerfile: apps/agent-gateway/Dockerfile.dev
    working_dir: /workspace/apps/agent-gateway
    environment:
      AGENT_GATEWAY_HTTP_ADDR: ":8080"
      AGENT_GATEWAY_POLICY_VERSION: policy-read-only-fixture-v1
      AGENT_GATEWAY_SERVICE_TOKEN: local-agent-runtime-token
      AGENT_GATEWAY_CAPABILITY_SECRET: local-execution-capability-secret
      AGENT_GATEWAY_DATA_MODE: mock
      GIN_MODE: debug
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - encois-local-dev-agent-gateway-tmp:/workspace/apps/agent-gateway/tmp

  api-gateway:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.dev
    working_dir: /workspace
    command: ["pnpm", "--filter", "@encois/api-gateway", "dev"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "8787"
      CORS_ORIGINS: http://localhost:5173
      CORS_CREDENTIALS: "false"
      AGENT_GATEWAY_POLICY_VERSION: policy-read-only-fixture-v1
      AGENT_GATEWAY_CAPABILITY_SECRET: local-execution-capability-secret
      IDENTITY_PLATFORM_PROJECT_ID: demo-encois
      IDENTITY_PLATFORM_ALLOWED_SIGN_IN_PROVIDERS: google.com,password
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      DATABASE_RUNTIME_URL: postgresql://api_gateway_runtime:api_gateway@postgres:5432/encois
      # Seeded workflow projections are served by the local database-backed mock.
      ENCOIS_WORKFLOW_MODE: database
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: encois-agent-runtime
    ports:
      - "8787:8787"
    depends_on:
      temporal:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - encois-local-dev-node-modules:/workspace/node_modules
      - encois-local-dev-api-node-modules:/workspace/apps/api-gateway/node_modules
      - encois-local-dev-contracts-node-modules:/workspace/packages/contracts/node_modules
      - encois-local-dev-persistence-node-modules:/workspace/packages/persistence/node_modules

  agent-runtime:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile.dev
    working_dir: /workspace/apps/agent-runtime
    environment:
      AGENT_RUNTIME_HTTP_ADDR: ":8090"
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: encois-agent-runtime
      AGENT_AI_MODE: mock
      AGENT_MEMORY_MODE: mock
      AGENT_MEMORY_FIXTURE: local
      AGENT_GATEWAY_URL: http://agent-gateway:8080
      AGENT_GATEWAY_SERVICE_TOKEN: local-agent-runtime-token
    ports:
      - "8090:8090"
    depends_on:
      temporal:
        condition: service_healthy
      agent-gateway:
        condition: service_started
      api-gateway:
        condition: service_started
    volumes:
      - .:/workspace
      - encois-local-dev-agent-runtime-tmp:/workspace/apps/agent-runtime/tmp

  dashboard:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.dev
    working_dir: /workspace
    command: ["pnpm", "--filter", "@encois/dashboard", "exec", "vite", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8787/api/v1
      VITE_FIREBASE_API_KEY: local
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: demo-encois
      VITE_FIREBASE_APP_ID: local
      VITE_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
      VITE_ENCOIS_UI_MODE: mock
    ports:
      - "5173:5173"
    depends_on:
      api-gateway:
        condition: service_started
      local-auth-seed:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - encois-local-dev-node-modules:/workspace/node_modules
      - encois-local-dev-dashboard-node-modules:/workspace/apps/dashboard/node_modules
      - encois-local-dev-contracts-node-modules:/workspace/packages/contracts/node_modules

volumes:
  encois-postgres-data:
  encois-temporal-data:
  encois-local-dev-node-modules:
  encois-local-dev-api-node-modules:
  encois-local-dev-dashboard-node-modules:
  encois-local-dev-contracts-node-modules:
  encois-local-dev-persistence-node-modules:
  encois-local-dev-agent-gateway-tmp:
  encois-local-dev-agent-runtime-tmp:
