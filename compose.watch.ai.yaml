name: encois-watch-ai

# Local application and infrastructure with real GCP AI/context adapters.
# Gemini, Agent Platform Memory Bank, and Spanner use ADC and GCP. Postgres, Temporal,
# Firebase Auth, Firebase Storage, and provider tools remain local fixtures.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: encois
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - encois-watch-ai-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/00-runtime-role.sql:/docker-entrypoint-initdb.d/00-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encois"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/temporal:1.8.2}
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233", "--namespace", "${TEMPORAL_NAMESPACE:-encois}"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - encois-watch-ai-temporal-data:/tmp
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  firebase-auth:
    image: encois-watch-ai/firebase-auth:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/firebase/Dockerfile
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    ports:
      - "4000:4000"
      - "9099:9099"
      - "9199:9199"
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['9099','9199'].map((port) => fetch('http://127.0.0.1:' + port + '/'))).then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - encois-watch-ai-firebase-data:/firebase/data

  migrations:
    image: encois-watch-ai/database-migrations:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: packages/database/Dockerfile
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    environment:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@postgres:5432/encois
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  local-auth-seed:
    image: encois-watch-ai/api-gateway:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: local-seed
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    command: ["node", "dist/scripts/seed-local.js"]
    environment:
      NODE_ENV: development
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@postgres:5432/encois
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      IDENTITY_PLATFORM_PROJECT_ID: demo-encois
      LOCAL_AUTH_EMAIL: owner@local.test
      LOCAL_AUTH_PASSWORD: local-password-1234
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-encois}
      TEMPORAL_TASK_QUEUE: encois-agent-runtime
    depends_on:
      firebase-auth:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: "no"

  local-ai-seed:
    profiles: ["manual"]
    image: encois-watch-ai/api-gateway:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: local-seed
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    command: ["node", "dist/scripts/seed-local-ai.js"]
    environment:
      NODE_ENV: development
      DATABASE_SEED_URL: postgresql://postgres:postgres@postgres:5432/encois
      DATABASE_RUNTIME_URL: postgresql://api_gateway_runtime:api_gateway@postgres:5432/encois
      FIREBASE_STORAGE_EMULATOR_HOST: firebase-auth:9199
      STORAGE_EMULATOR_HOST: http://firebase-auth:9199
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      SOURCE_ARTIFACT_BUCKET: demo-encois.appspot.com
      IDENTITY_PLATFORM_PROJECT_ID: demo-encois
      CONTROL_PLANE_SERVICE_USER_ID: 00000000-0000-4000-8000-000000000010
      AGENT_GATEWAY_URL: http://agent-gateway:8080
      AGENT_GATEWAY_POLICY_VERSION: policy-read-only-fixture-v1
      AGENT_GATEWAY_CAPABILITY_SECRET: local-execution-capability-secret
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-encois}
      TEMPORAL_TASK_QUEUE: encois-agent-runtime
      LOCAL_AI_SEED_SOURCE_LIMIT: ${LOCAL_AI_SEED_SOURCE_LIMIT:-5}
      LOCAL_AI_SEED_REVISION: ${LOCAL_AI_SEED_REVISION:-ai-demo-v1}
      SEED_ORGANIZATION_SLUG: ${SEED_ORGANIZATION_SLUG:-organization-sun}
    depends_on:
      local-auth-seed:
        condition: service_completed_successfully
      api-gateway:
        condition: service_started
      agent-runtime:
        condition: service_started
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?set GOOGLE_APPLICATION_CREDENTIALS to an ADC JSON file}
        target: /var/run/secrets/google/application_default_credentials.json
        read_only: true

  agent-gateway:
    image: encois-watch-ai/agent-gateway:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/agent-gateway/Dockerfile.dev
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    working_dir: /workspace/apps/agent-gateway
    environment:
      AGENT_GATEWAY_HTTP_ADDR: ":8080"
      AGENT_GATEWAY_POLICY_VERSION: policy-read-only-fixture-v1
      AGENT_GATEWAY_SERVICE_TOKEN: local-agent-runtime-token
      AGENT_GATEWAY_CAPABILITY_SECRET: local-execution-capability-secret
      AGENT_GATEWAY_DATA_MODE: hybrid
      AGENT_GATEWAY_STORAGE_MODE: gcs
      GCP_STORAGE_BUCKET: demo-encois.appspot.com
      STORAGE_EMULATOR_HOST: http://firebase-auth:9199
      SPANNER_DATABASE: ${SPANNER_DATABASE:?set SPANNER_DATABASE}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?set GOOGLE_CLOUD_PROJECT}
      GIN_MODE: debug
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
    ports:
      - "8080:8080"
    depends_on:
      firebase-auth:
        condition: service_healthy
    volumes:
      - .:/workspace
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?set GOOGLE_APPLICATION_CREDENTIALS to an ADC JSON file}
        target: /var/run/secrets/google/application_default_credentials.json
        read_only: true
      - encois-watch-ai-agent-gateway-tmp:/workspace/apps/agent-gateway/tmp

  api-gateway:
    image: encois-watch-ai/api-gateway-dev:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/node/Dockerfile.dev
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    working_dir: /workspace
    command: ["pnpm", "--filter", "@encois/api-gateway", "dev"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "8787"
      CORS_ORIGINS: http://localhost:5173
      CORS_CREDENTIALS: "false"
      AGENT_GATEWAY_POLICY_VERSION: policy-read-only-fixture-v1
      AGENT_GATEWAY_CAPABILITY_SECRET: local-execution-capability-secret
      AGENT_GATEWAY_URL: http://agent-gateway:8080
      AGENT_GATEWAY_SERVICE_TOKEN: local-agent-runtime-token
      AGENT_RUNTIME_URL: http://agent-runtime:8090
      AGENT_RUNTIME_SERVICE_TOKEN: local-runtime-inspection-token
      CONTROL_PLANE_SERVICE_TOKEN: local-control-plane-token
      CONTROL_PLANE_SERVICE_USER_ID: 00000000-0000-4000-8000-000000000010
      IDENTITY_PLATFORM_PROJECT_ID: demo-encois
      IDENTITY_PLATFORM_ALLOWED_SIGN_IN_PROVIDERS: google.com,password
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_STORAGE_EMULATOR_HOST: firebase-auth:9199
      SOURCE_ARTIFACT_BUCKET: demo-encois.appspot.com
      DATABASE_RUNTIME_URL: postgresql://api_gateway_runtime:api_gateway@postgres:5432/encois
      ENCOIS_WORKFLOW_MODE: temporal
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-encois}
      TEMPORAL_TASK_QUEUE: encois-agent-runtime
    ports:
      - "8787:8787"
    depends_on:
      firebase-auth:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/api-gateway/node_modules
      - /workspace/packages/contracts/node_modules
      - /workspace/packages/database/node_modules

  agent-runtime:
    image: encois-watch-ai/agent-runtime:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile.dev
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    working_dir: /workspace/apps/agent-runtime
    environment:
      AGENT_RUNTIME_HTTP_ADDR: ":8090"
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-encois}
      TEMPORAL_TASK_QUEUE: encois-agent-runtime
      AGENT_AI_MODE: gemini
      AGENT_SOURCE_MODE: gateway
      AGENT_MEMORY_MODE: gcp
      AGENT_RUNTIME_SERVICE_TOKEN: local-runtime-inspection-token
      AGENT_PLATFORM_MEMORY_REASONING_ENGINE: ${AGENT_PLATFORM_MEMORY_REASONING_ENGINE:?set AGENT_PLATFORM_MEMORY_REASONING_ENGINE}
      CONTROL_PLANE_URL: http://api-gateway:8787
      CONTROL_PLANE_SERVICE_TOKEN: local-control-plane-token
      AGENT_GATEWAY_URL: http://agent-gateway:8080
      AGENT_GATEWAY_SERVICE_TOKEN: local-agent-runtime-token
      GOOGLE_GENAI_USE_AGENT_PLATFORM: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?set GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-east1}
      GOOGLE_CLOUD_MODEL_LOCATION: ${GOOGLE_CLOUD_MODEL_LOCATION:-us}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GEMINI_REASONING_THINKING_LEVEL: ${GEMINI_REASONING_THINKING_LEVEL:-high}
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
    ports:
      - "8090:8090"
    depends_on:
      temporal:
        condition: service_healthy
      agent-gateway:
        condition: service_started
      api-gateway:
        condition: service_started
    volumes:
      - .:/workspace
      - encois-watch-ai-agent-runtime-tmp:/workspace/apps/agent-runtime/tmp
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?set GOOGLE_APPLICATION_CREDENTIALS to an ADC JSON file}
        target: /var/run/secrets/google/application_default_credentials.json
        read_only: true

  dashboard:
    image: encois-watch-ai/dashboard-dev:${ENCOIS_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/node/Dockerfile.dev
      args:
        ENCOIS_VERSION: ${ENCOIS_VERSION:-1.0.0}
    working_dir: /workspace
    command: ["pnpm", "--filter", "@encois/dashboard", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8787/api/v1
      VITE_FIREBASE_API_KEY: local
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: demo-encois
      VITE_FIREBASE_APP_ID: local
      VITE_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
    ports:
      - "5173:5173"
    depends_on:
      api-gateway:
        condition: service_started
      local-auth-seed:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/dashboard/node_modules
      - /workspace/packages/contracts/node_modules

volumes:
  encois-watch-ai-postgres-data:
  encois-watch-ai-temporal-data:
  encois-watch-ai-firebase-data:
  encois-watch-ai-agent-gateway-tmp:
  encois-watch-ai-agent-runtime-tmp:
