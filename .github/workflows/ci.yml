name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Install and bootstrap workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated permission contracts
        run: |
          pnpm --filter @encois/contracts generate:permissions
          git diff --exit-code -- \
            packages/contracts/permissions.json \
            packages/contracts/permissions_generated.go \
            packages/contracts/src/permissions.generated.ts

      - name: Verify workspace release version
        run: pnpm version:check

  node-quality:
    name: Node ${{ matrix.name }} checks
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API Gateway
            package: '@encois/api-gateway'
          - name: Dashboard
            package: '@encois/dashboard'
          - name: Contracts
            package: '@encois/contracts'
          - name: Database
            package: '@encois/database'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm --filter @encois/contracts build
          pnpm --filter @encois/database build

      - name: Lint and type review
        run: pnpm --filter "${{ matrix.package }}" lint

      - name: Unit tests
        run: pnpm --filter "${{ matrix.package }}" test

  go-quality:
    name: Go ${{ matrix.name }} checks
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Contracts
            module: packages/contracts
          - name: Agent Gateway
            module: apps/agent-gateway
          - name: Agent Runtime
            module: apps/agent-runtime
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "$files"

      - name: Unit tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Static analysis
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  node-build:
    name: Build TypeScript workspace
    needs: node-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all TypeScript workspace packages
        run: pnpm build

  drizzle-integration:
    name: Drizzle migrations and PostgreSQL integration
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: encois
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d encois"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/encois
        run: pnpm --filter @encois/database db:migrate

      - name: Create restricted PostgreSQL runtime role
        env:
          PGPASSWORD: postgres
        run: psql --host 127.0.0.1 --port 5432 --username postgres --dbname encois --file docker/postgres/init/00-runtime-role.sql

      - name: Verify RLS and command receipt schema
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/encois
        run: pnpm --filter @encois/database db:verify

      - name: Run database integration tests with runtime RLS
        env:
          DATABASE_TEST_URL: postgresql://api_gateway_runtime:api_gateway@127.0.0.1:5432/encois
          DATABASE_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/encois
        run: pnpm --filter @encois/database test:integration

      - name: Build shared runtime packages
        run: |
          pnpm --filter @encois/contracts build
          pnpm --filter @encois/database build

      - name: Verify concurrent API command delivery
        env:
          DATABASE_RUNTIME_URL: postgresql://api_gateway_runtime:api_gateway@127.0.0.1:5432/encois
          DATABASE_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/encois
          AGENT_GATEWAY_POLICY_VERSION: policy-read-only-fixture-v1
        run: pnpm --filter @encois/api-gateway verify:command-receipts

  terraform:
    name: Terraform configuration
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize root providers without backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validate root configuration
        working-directory: infra
        run: terraform validate

      - name: Check bootstrap formatting
        run: terraform fmt -check -recursive infra/bootstrap

      - name: Initialize bootstrap providers without backend
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap configuration
        working-directory: infra/bootstrap
        run: terraform validate

  compose-config:
    name: Local Compose configuration
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate local Compose file
        run: docker compose -f compose.watch.mock.yaml config --quiet

  local-smoke:
    name: Local Temporal execution smoke
    needs: [node-quality, go-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent-runtime/go.mod
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages for the smoke script
        run: |
          pnpm --filter @encois/contracts build
          pnpm --filter @encois/database build

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0
        with:
          version: v1.8.2

      - name: Run local release and approval smoke
        env:
          CI: true
        run: bash scripts/smoke-release-local.sh

  containers:
    name: Build ${{ matrix.name }} image
    needs: [node-quality, node-build, go-quality, drizzle-integration, terraform, compose-config, local-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            file: apps/dashboard/Dockerfile
          - name: api-gateway
            file: apps/api-gateway/Dockerfile
          - name: agent-runtime
            file: apps/agent-runtime/Dockerfile
          - name: agent-gateway
            file: apps/agent-gateway/Dockerfile
          - name: database-migrations
            file: packages/database/Dockerfile
          - name: firebase-auth
            file: docker/firebase/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Read workspace release version
        id: version
        run: echo "version=$(node scripts/project-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build image without pushing
        shell: bash
        run: |
          args=()
          if [ "${{ matrix.name }}" = "dashboard" ]; then
            args+=(--build-arg VITE_BASE_PATH=/dashboard/)
          fi
          docker build "${args[@]}" \
            --build-arg ENCOIS_VERSION="${{ steps.version.outputs.version }}" \
            --file "${{ matrix.file }}" \
            --tag "encois/${{ matrix.name }}:${{ steps.version.outputs.version }}" \
            .

      - name: Smoke hosted dashboard path
        if: ${{ matrix.name == 'dashboard' }}
        shell: bash
        run: |
          set -euo pipefail
          image="encois/dashboard:${{ steps.version.outputs.version }}"
          container="encois-dashboard-smoke"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --publish 18080:8080 "$image" >/dev/null

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          index_html="$(curl --fail --silent http://127.0.0.1:18080/dashboard/)"
          asset_path="$(printf '%s' "$index_html" | grep -oE '/dashboard/assets/[^" ]+\.js' | head -n 1 || true)"
          test -n "$asset_path"
          asset_body="$(curl --fail --silent "http://127.0.0.1:18080${asset_path}")"
          case "$asset_body" in
            '<!doctype html>'*|'<!DOCTYPE html>'*)
              echo "The dashboard asset route returned the SPA document instead of JavaScript." >&2
              exit 1
              ;;
          esac

          curl --fail --silent http://127.0.0.1:18080/dashboard/workflows >/dev/null
