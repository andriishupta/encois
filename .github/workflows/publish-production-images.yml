name: Publish production images (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to build and push immutable production images
        required: true
        default: NO
        type: string
      image_tag:
        description: Immutable Artifact Registry tag, for example sha-abc1234
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish production images
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY || 'containers' }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_ENCOIS_SUPPORT_EMAIL: ${{ vars.VITE_ENCOIS_SUPPORT_EMAIL }}
      VITE_ENCOIS_CREATOR_EMAIL: ${{ vars.VITE_ENCOIS_CREATOR_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Validate image and production build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID" || { echo "GCP_PROJECT_ID environment variable is required" >&2; exit 1; }
          test -n "$IMAGE_TAG" || { echo "image_tag is required" >&2; exit 1; }
          [[ "$IMAGE_TAG" != "latest" ]] || { echo "latest is not an immutable production tag" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "image_tag contains unsupported characters" >&2; exit 1; }
          test -n "$VITE_FIREBASE_API_KEY" || { echo "VITE_FIREBASE_API_KEY environment variable is required" >&2; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "VITE_FIREBASE_AUTH_DOMAIN environment variable is required" >&2; exit 1; }
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "VITE_FIREBASE_PROJECT_ID environment variable is required" >&2; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "VITE_FIREBASE_APP_ID environment variable is required" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Read workspace release version
        id: version
        run: echo "version=$(node scripts/project-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable images
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image_root="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}"

          docker build \
            --build-arg ENCOIS_VERSION="$VERSION" \
            --build-arg VITE_BASE_PATH=/dashboard/ \
            --build-arg VITE_FIREBASE_API_KEY="$VITE_FIREBASE_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_FIREBASE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_FIREBASE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_APP_ID="$VITE_FIREBASE_APP_ID" \
            --build-arg VITE_ENCOIS_SUPPORT_EMAIL="$VITE_ENCOIS_SUPPORT_EMAIL" \
            --build-arg VITE_ENCOIS_CREATOR_EMAIL="$VITE_ENCOIS_CREATOR_EMAIL" \
            --file apps/dashboard/Dockerfile \
            --tag "${image_root}/dashboard:${IMAGE_TAG}" \
            .
          docker push "${image_root}/dashboard:${IMAGE_TAG}"

          for service in api agent-runtime agent-gateway; do
            docker build \
              --build-arg ENCOIS_VERSION="$VERSION" \
              --file "apps/${service}/Dockerfile" \
              --tag "${image_root}/${service}:${IMAGE_TAG}" \
              .
            docker push "${image_root}/${service}:${IMAGE_TAG}"
          done

          docker build \
            --build-arg ENCOIS_VERSION="$VERSION" \
            --file packages/persistence/Dockerfile \
            --tag "${image_root}/migrations:${IMAGE_TAG}" \
            .
          docker push "${image_root}/migrations:${IMAGE_TAG}"

          docker build \
            --build-arg ENCOIS_VERSION="$VERSION" \
            --file packages/persistence/Dockerfile \
            --tag "${image_root}/retention:${IMAGE_TAG}" \
            .
          docker push "${image_root}/retention:${IMAGE_TAG}"

      - name: Record published image references
        run: |
          image_root="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}"
          {
            echo "Published immutable images for ${IMAGE_TAG}:"
            echo "${image_root}/dashboard:${IMAGE_TAG}"
            echo "${image_root}/api:${IMAGE_TAG}"
            echo "${image_root}/agent-runtime:${IMAGE_TAG}"
            echo "${image_root}/agent-gateway:${IMAGE_TAG}"
            echo "${image_root}/migrations:${IMAGE_TAG}"
            echo "${image_root}/retention:${IMAGE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
