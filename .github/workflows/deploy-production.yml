name: Validate production plan (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PLAN to run a read-only production Terraform plan
        required: true
        default: NO
        type: string
      image_tag:
        description: Immutable Artifact Registry tag; ignored by the first-deploy registry phase
        required: true
        type: string
      phase:
        description: Foundation creates databases/jobs first; application deploys the runtime services after migrations
        required: true
        default: application
        type: choice
        options:
          - registry
          - foundation
          - application

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Apply reviewed production infrastructure
    if: ${{ inputs.confirm == 'PLAN' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY || 'containers' }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOYMENT_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4

      - name: Materialize protected production variables
        env:
          PRODUCTION_TFVARS: ${{ secrets.PRODUCTION_TFVARS }}
        run: |
          umask 077
          printf '%s' "$PRODUCTION_TFVARS" > "$RUNNER_TEMP/production.tfvars"

      - name: Validate release inputs and published images
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET repository variable is required" >&2; exit 1; }
          test -n "$GCP_PROJECT_ID" || { echo "GCP_PROJECT_ID repository variable is required" >&2; exit 1; }
          if [[ "$DEPLOYMENT_PHASE" != "registry" ]]; then
            test -n "$IMAGE_TAG" || { echo "image_tag is required" >&2; exit 1; }
            [[ "$IMAGE_TAG" != "latest" ]] || { echo "latest is not an immutable production tag" >&2; exit 1; }
            [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "image_tag contains unsupported characters" >&2; exit 1; }
          fi
          grep -Eq '^[[:space:]]*environment[[:space:]]*=[[:space:]]*"production"[[:space:]]*$' "$RUNNER_TEMP/production.tfvars" || { echo "production.tfvars must target environment=production" >&2; exit 1; }
          if [[ "$DEPLOYMENT_PHASE" == "application" ]]; then
            grep -Eq '^[[:space:]]*enable_dashboard[[:space:]]*=[[:space:]]*true[[:space:]]*$' "$RUNNER_TEMP/production.tfvars" || { echo "production.tfvars must enable the dashboard" >&2; exit 1; }
            grep -Eq '^[[:space:]]*enable_api[[:space:]]*=[[:space:]]*true[[:space:]]*$' "$RUNNER_TEMP/production.tfvars" || { echo "production.tfvars must enable the API" >&2; exit 1; }
          fi
          if grep -Eq '^[[:space:]]*(dashboard|api|agent_runtime|agent_gateway)_image[[:space:]]*=.*:latest([[:space:]]|"|$)' "$RUNNER_TEMP/production.tfvars"; then
            echo "production.tfvars contains a mutable latest image tag" >&2
            exit 1
          fi

          if [[ "$DEPLOYMENT_PHASE" != "registry" ]]; then
            image_root="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}"
            for service in dashboard api agent-runtime agent-gateway migrations retention; do
              gcloud artifacts docker images describe "${image_root}/${service}:${IMAGE_TAG}" --quiet >/dev/null
            done
          fi

      - name: Initialize remote Terraform state
        run: terraform -chdir=infra init -reconfigure -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Validate production configuration
        run: terraform -chdir=infra validate

      - name: Protect managed resources from a repeated bootstrap phase
        if: ${{ inputs.phase == 'registry' || inputs.phase == 'foundation' }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(terraform -chdir=infra state list)"
          if grep -Eq '^google_cloud_run_v2_service\.(dashboard|api|agent_runtime|agent_gateway)(\[|$)' <<<"$state"; then
            echo "Registry/foundation phases are only for the first deploy. Application services already exist; refusing a plan that would remove them." >&2
            exit 1
          fi
          if [[ "$DEPLOYMENT_PHASE" == "registry" ]] && grep -Eq '^google_sql_database_instance\.control_plane(\[|$)' <<<"$state"; then
            echo "Registry phase is only for the first deploy. Cloud SQL already exists; refusing a plan that would remove it." >&2
            exit 1
          fi

      - name: Create read-only production plan
        shell: bash
        run: |
          set -euo pipefail
          image_root="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}"
          args=(
            -input=false
            -var-file="$RUNNER_TEMP/production.tfvars"
            -var="dashboard_image=${image_root}/dashboard:${IMAGE_TAG}"
            -var="api_image=${image_root}/api:${IMAGE_TAG}"
            -var="agent_runtime_image=${image_root}/agent-runtime:${IMAGE_TAG}"
            -var="agent_gateway_image=${image_root}/agent-gateway:${IMAGE_TAG}"
            -var="migration_image=${image_root}/migrations:${IMAGE_TAG}"
            -var="retention_image=${image_root}/retention:${IMAGE_TAG}"
          )
          if [[ "$DEPLOYMENT_PHASE" == "registry" || "$DEPLOYMENT_PHASE" == "foundation" ]]; then
            args+=(
              -var="enable_dashboard=false"
              -var="enable_api=false"
              -var="enable_agent_runtime=false"
              -var="enable_agent_gateway=false"
              -var="enable_identity_platform=false"
              -var="enable_edge=false"
            )
          fi
          if [[ "$DEPLOYMENT_PHASE" == "registry" ]]; then
            args+=(
              -var="enable_cloud_sql=false"
            )
          fi
          terraform -chdir=infra plan "${args[@]}" -out="$RUNNER_TEMP/production.tfplan"

      - name: Smoke test the deployed Cloud Run services
        if: ${{ inputs.phase == 'application' }}
        shell: bash
        run: |
          set -euo pipefail
          dashboard_url="$(terraform -chdir=infra output -raw dashboard_url)"
          api_url="$(terraform -chdir=infra output -raw api_url)"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "${api_url%/}/healthz" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "${dashboard_url%/}/" >/dev/null
          auth_status="$(curl --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused --output /dev/null --write-out '%{http_code}' "${api_url%/}/api/v1/auth/me")"
          [[ "$auth_status" == "401" ]] || {
            echo "Unauthenticated auth boundary returned unexpected status: $auth_status" >&2
            exit 1
          }

      - name: Record deployed release
        run: |
          {
            echo "Production infrastructure plan completed (read-only)"
            echo "- phase: ${DEPLOYMENT_PHASE}"
            echo "- image tag: ${IMAGE_TAG}"
            echo "- migration job image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}/migrations:${IMAGE_TAG}"
            echo "- retention job image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}/retention:${IMAGE_TAG}"
            if [[ "$DEPLOYMENT_PHASE" == "application" ]]; then
              dashboard_url="$(terraform -chdir=infra output -raw dashboard_url)"
              api_url="$(terraform -chdir=infra output -raw api_url)"
              echo "- dashboard: ${dashboard_url}"
              echo "- API: ${api_url}"
              echo "- readiness: ${api_url%/}/healthz"
            elif [[ "$DEPLOYMENT_PHASE" == "registry" ]]; then
              echo "- next step: publish the production images, then deploy the foundation phase"
            else
              echo "- next step: run the production migration workflow, then deploy the application phase"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
