server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health/live {
    default_type application/json;
    return 200 '{"data":{"status":"ok"}}';
  }

  location = /health/ready {
    default_type application/json;
    return 200 '{"data":{"status":"ok"}}';
  }

  location = /dashboard {
    return 301 /dashboard/;
  }

  # The external load balancer keeps the /dashboard prefix when forwarding to
  # Cloud Run. Vite emits assets under that prefix, while the image stores the
  # built files at the nginx document root; strip the routing prefix before
  # resolving assets and SPA routes.
  location ^~ /dashboard/ {
    rewrite ^/dashboard/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
